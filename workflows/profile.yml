name: Atualizar perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
  push:
    paths:
      - '.github/workflows/profile.yml'
      - '.github/scripts/update-profile.mjs'

permissions:
  contents: write

concurrency:
  group: atualizar-perfil
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar resumo dos repositórios públicos
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/update-profile.mjs
      - name: Gerar animação das contribuições
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#8b5cf6
            assets/snake-dark.svg?palette=github-dark&color_snake=#a78bfa
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preservar animações anteriores se a geração falhar
        if: steps.snake.outcome == 'failure'
        run: git restore -- assets/snake.svg assets/snake-dark.svg
      - name: Salvar imagens atualizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/snake.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Atualiza estatísticas e animação do perfil'
          git push origin HEAD:${{ github.event.repository.default_branch }}
